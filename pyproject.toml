[project]
name = "pcb-inspection"
version = "0.1.0"
description = "Semesterarbeit Platinen: Platinen freistellen, IC-Gehäuse erkennen, Qualität klassifizieren"
readme = "README.md"
requires-python = ">=3.10,<3.13"  # TensorFlow unterstützt neuere Versionen noch nicht zuverlässig
dependencies = [
    "numpy",
    "Pillow>=10",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
gehaeuse = [
    "ultralytics>=8.3,<9",
    "huggingface-hub>=0.26,<1",
]
training = [
    "tensorflow>=2.16",
    "keras>=3",  # seit TF 2.16 eigenes Paket, wird direkt importiert
    "scikit-learn",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
alles = ["pcb-inspection[gehaeuse,training,dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # Tests laufen auch ohne pip install -e .
# Datenprüfungen laufen nur auf Wunsch: pytest -m daten
addopts = "-m 'not daten'"
markers = [
    "daten: prüft den echten Datensatz unter data/ (langsamer, braucht die Bilder)",
]

[tool.ruff]
line-length = 88  # wie black und der Standard im Editor
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# E/W/F: Fehler und Stil, I: Importreihenfolge, D: Docstrings, Q: Anführungszeichen
# DOC201/DOC501: Docstring muss Returns und Raises nennen, wenn die Funktion
# etwas zurückgibt oder eine Exception wirft. Die D-Regeln prüfen nur die Form.
select = ["E", "W", "F", "I", "D", "Q", "DOC201", "DOC501"]
preview = true  # die DOC-Regeln gibt es bisher nur als Preview
explicit-preview-rules = true  # sonst würden alle Preview-Regeln aktiv

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "DOC"]  # Testnamen beschreiben sich selbst
